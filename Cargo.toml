[package]
name = "save_game_manager"
version = "0.2.0"
edition = "2024"
description = "SaveVault: automatic game save detection, snapshots, profiles, rollback and two-way sync backed by a private git repository."

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "7.0"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.1.11"
globset = "0.4.21"
hostname = "0.4.2"
rfd = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9.42"
sha2 = "0.10"
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }
tar = "0.4.46"
tempfile = "3.27"
ureq = { version = "3.5", features = ["json"] }
walkdir = "2.5"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
